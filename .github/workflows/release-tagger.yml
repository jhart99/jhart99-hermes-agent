name: Release Tagger

on:
  push:
    branches:
      - main
    paths:
      - 'VERSION'

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        run: |
          VERSION=$(cat VERSION)
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "TAG_VERSION=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "${{ steps.get_version.outputs.TAG_VERSION }}" >/dev/null 2>&1; then
            git tag "${{ steps.get_version.outputs.TAG_VERSION }}"
            git push origin "${{ steps.get_version.outputs.TAG_VERSION }}"
          fi
